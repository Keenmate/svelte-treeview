<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<!-- Pin cascade-layer order BEFORE any stylesheet loads: layer order is set by first
		     declaration. The devkit kit (`kmwc`, showcase) and examples-shared.css's `reset`
		     (/test, /dev) must sit BELOW the library's layers — otherwise their `* { margin: 0 }`
		     resets and native button/checkbox styling would beat the tree's own rules. -->
		<style>@layer kmwc, reset, variables, component, overrides;</style>
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Svelte Treeview Examples</title>

		<!-- Basic statistics -->
		<script
			defer
			data-domain="svelte-treeview.demo.keenmate.com"
			src="https://stats.keenmate.services/js/plausible.js"
		></script>

		<!-- Google Fonts: Fira Sans Condensed (used by sunburst layout) -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@400;700&display=swap" rel="stylesheet" />

		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div>%sveltekit.body%</div>
	</body>
</html>
